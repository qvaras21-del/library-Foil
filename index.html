<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio — Online Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="logo" href="#/">Folio</a>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Search by title or Book ID, e.g. BK-482913" aria-label="Search books">
      </form>
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <dialog id="authDlg">
    <form method="dialog" id="authForm">
      <h2 id="authTitle">Sign in</h2>
      <label id="nameRow" hidden>Display name <input name="name" maxlength="30"></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Password <input name="password" type="password" minlength="6" required></label>
      <p class="err" id="authErr"></p>
      <div class="row">
        <button class="btn" type="submit">Continue</button>
        <button class="btn ghost" type="button" id="authSwitch">Create an account</button>
        <button class="btn ghost" type="button" id="authClose">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="payDlg"><div id="payBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
